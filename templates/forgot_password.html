<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA: installable app icon + behaviour -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2b1552">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script defer src="{{ url_for('static', filename='pwa.js') }}"></script>
    <title>Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260723v3">
</head>
<body>
    <a href="/dashboard" class="back-btn">
    ←
</a>

<div class="main-container">

    <div class="left-section">
        <img src="{{ url_for('static', filename='images/wallet.png') }}" alt="Wallet">
    </div>

    <div class="login-card">

        <h1>Forgot Password</h1>
        <p>Enter your registered email</p>

        <form>

            <label>Email Address</label>

            <input type="email"
                   placeholder="Enter your email">

            <button type="submit">
                SEND OTP
            </button>

        </form>

        <div class="bottom-link">
            Remember Password?
            <a href="/">Login</a>
        </div>

    </div>

</div>

</body>
</html>
